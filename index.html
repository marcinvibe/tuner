<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tuner</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tuner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="view learn" id="view-learn">
    <div class="lib" id="lib">
      <header class="lib-top">
        <h1>Nauka</h1>
        <label class="add-btn">
          <span>+ Dodaj utwór</span>
          <input type="file" id="fileInput" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
        </label>
      </header>
      <ul class="song-list" id="songList"></ul>
      <div class="lib-empty" id="libEmpty">
        <p><strong>Brak utworów.</strong></p>
        <p>W Songsterr otwórz utwór, wybierz <em>Export → MIDI</em>, a potem dodaj plik tutaj.</p>
        <p class="small">Utwory zostają tylko na tym urządzeniu.</p>
      </div>
    </div>

    <div class="player" id="player" hidden>
      <header class="p-top">
        <button class="round sm" id="backBtn" aria-label="Wróć">‹</button>
        <div class="p-titles">
          <div class="p-title" id="songTitle"></div>
          <div class="p-sub">
            <label class="p-select"><select id="trackSel" aria-label="Ścieżka"></select></label>
            <span class="pill" id="songTuning"></span>
          </div>
        </div>
      </header>

      <canvas class="highway" id="highway"></canvas>
      <canvas class="fretboard" id="fretboard"></canvas>

      <div class="p-status">
        <span id="learnHint"></span>
        <span class="score" id="learnScore" hidden></span>
      </div>

      <div class="p-seek">
        <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Pozycja">
        <span id="barLabel"></span>
      </div>

      <div class="p-controls">
        <div class="seg" id="modes">
          <button data-mode="wait" class="active">Czekaj</button>
          <button data-mode="play">Graj</button>
          <button data-mode="watch">Słuchaj</button>
        </div>
        <div class="p-row">
          <button class="ctl" id="restartBtn" aria-label="Od początku">↺</button>
          <button class="play-btn" id="playBtn" aria-label="Graj"></button>
          <button class="ctl" id="loopBtn">Pętla</button>
          <button class="ctl sq" id="zoomBtn" aria-label="Powiększenie">M</button>
        </div>
        <label class="p-speed">
          <span>Tempo</span>
          <input type="range" id="speed" min="25" max="100" step="5" value="60">
          <span id="speedVal">60%</span>
        </label>
      </div>
    </div>
  </section>

  <main class="app view" id="view-tune" data-state="idle" hidden>
    <header class="top">
      <button class="round" id="refBtn" aria-label="Częstotliwość A4"><span id="refVal">440</span><small>A4</small></button>
      <div class="titles">
        <h1>Tuner</h1>
        <label class="tuning">
          <select id="tuning" aria-label="Strojenie"></select>
        </label>
      </div>
    </header>

    <section class="gauge">
      <svg viewBox="0 0 340 196" aria-hidden="true">
        <g id="ticks"></g>
        <text class="end" x="14" y="190">♭</text>
        <text class="end" x="326" y="190" text-anchor="end">♯</text>
        <g id="needle" class="needle">
          <line x1="170" y1="178" x2="170" y2="58" />
          <circle cx="170" cy="178" r="6" />
        </g>
      </svg>
      <div class="center">
        <div class="note"><span id="note">–</span><sub id="octave"></sub></div>
        <div class="hz"><span id="freq">0.0</span> Hz</div>
      </div>
    </section>

    <div class="status">
      <span id="hint">Naciśnij Start</span>
      <span class="badge" id="badge" aria-hidden="true"></span>
      <span class="cents" id="cents"></span>
    </div>

    <section class="preview" id="preview" aria-label="Podgląd strun"></section>

    <div class="picker" id="picker" aria-label="Wybór struny"></div>

    <button class="start" id="startBtn">Start</button>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="learn" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg>
      <span>Nauka</span>
    </button>
    <button data-view="tune">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0" /><path d="M12 18l4-6" /></svg>
      <span>Stroik</span>
    </button>
  </nav>

  <script src="app.js" type="module"></script>
</body>
</html>
