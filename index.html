<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tuner</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tuner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" data-state="idle">
    <header class="top">
      <button class="round" id="refBtn" aria-label="Częstotliwość A4"><span id="refVal">440</span><small>A4</small></button>
      <div class="titles">
        <h1>Tuner</h1>
        <label class="tuning">
          <select id="tuning" aria-label="Strojenie"></select>
        </label>
      </div>
    </header>

    <section class="gauge">
      <svg viewBox="0 0 340 196" aria-hidden="true">
        <g id="ticks"></g>
        <text class="end" x="14" y="190">♭</text>
        <text class="end" x="326" y="190" text-anchor="end">♯</text>
        <g id="needle" class="needle">
          <line x1="170" y1="178" x2="170" y2="58" />
          <circle cx="170" cy="178" r="6" />
        </g>
      </svg>
      <div class="center">
        <div class="note"><span id="note">–</span><sub id="octave"></sub></div>
        <div class="hz"><span id="freq">0.0</span> Hz</div>
      </div>
    </section>

    <div class="status">
      <span id="hint">Naciśnij Start</span>
      <span class="badge" id="badge" aria-hidden="true"></span>
      <span class="cents" id="cents"></span>
    </div>

    <section class="preview" id="preview" aria-label="Podgląd strun"></section>

    <div class="picker" id="picker" aria-label="Wybór struny"></div>

    <button class="start" id="startBtn">Start</button>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
